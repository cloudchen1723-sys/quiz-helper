<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6" />

  <!-- Center Emblem: Book & Sparkle -->
  <g transform="translate(96, 96)" filter="url(#glow)">
    <!-- Book Left Page -->
    <path d="M160 80 C90 80 40 100 20 110 L20 280 C40 270 90 250 160 250 C230 250 280 270 300 280 L300 110 C280 100 230 80 160 80 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Book Spine Divider -->
    <line x1="160" y1="80" x2="160" y2="250" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />
    
    <!-- Checkmark / Sparkle of Mastery -->
    <path d="M120 165 L145 190 L205 130" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Top Sparkle Star -->
    <path d="M250 40 Q265 65 290 80 Q265 95 250 120 Q235 95 210 80 Q235 65 250 40 Z" fill="url(#goldGrad)" />
  </g>
</svg>
